# Topology B (Baseline): Envoy Proxy without Custos ext_proc filter.
# Forwards downstream gRPC KServe v2 inference traffic on 0.0.0.0:8001 -> 127.0.0.1:9001.
admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901

static_resources:
  listeners:
    - name: kserve_v2_grpc_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8001
      per_connection_buffer_limit_bytes: 16777216 # 16 MiB
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_kserve_v2_baseline
                codec_type: AUTO
                http2_protocol_options:
                  max_concurrent_streams: 1024
                  initial_stream_window_size: 16777216
                  initial_connection_window_size: 33554432
                  max_outbound_frames: 10000
                  max_outbound_control_frames: 1000
                  max_consecutive_inbound_frames_with_empty_payload: 1
                  max_inbound_priority_frames_per_stream: 100
                  max_inbound_window_update_frames_per_data_frame_sent: 10
                route_config:
                  name: kserve_v2_route
                  virtual_hosts:
                    - name: triton_vhost
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/inference.GRPCInferenceService/"
                          route:
                            cluster: triton_upstream_cluster
                            timeout: 30s
                http_filters:
                  - name: envoy.filters.http.buffer
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.buffer.v3.Buffer
                      max_request_bytes: 16777216
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: triton_upstream_cluster
      connect_timeout: 2s
      type: STATIC
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: triton_upstream_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 9001
