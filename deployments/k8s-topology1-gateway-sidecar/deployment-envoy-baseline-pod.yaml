# =============================================================================
# Proxy Baseline (Envoy Only — No Custos Sidecar)
# =============================================================================
# Isolates the baseline latency and CPU/RSS cost of standard Kubernetes Envoy
# HTTP/2 ingress proxying from the custos-proc Native Sidecar.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: custos-envoy-baseline-config
  labels:
    app.kubernetes.io/name: envoy-baseline
    app.kubernetes.io/part-of: custos
data:
  envoy.yaml: |
    admin:
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 9902

    static_resources:
      listeners:
        - name: kserve_v2_baseline_listener
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 8002
          per_connection_buffer_limit_bytes: 16777216
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress_kserve_v2_baseline
                    codec_type: AUTO
                    generate_request_id: true
                    stream_idle_timeout: 15s
                    request_timeout: 30s
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                          log_format:
                            json_format:
                              timestamp: "%START_TIME%"
                              request_id: "%REQ(X-REQUEST-ID)%"
                              grpc_path: "%REQ(:PATH)%"
                              authority: "%REQ(:AUTHORITY)%"
                              http_status: "%RESPONSE_CODE%"
                              grpc_status: "%GRPC_STATUS%"
                              response_code_details: "%RESPONSE_CODE_DETAILS%"
                              bytes_received: "%BYTES_RECEIVED%"
                              duration_ms: "%DURATION%"
                              upstream_host: "%UPSTREAM_HOST%"
                    http2_protocol_options:
                      max_concurrent_streams: 1024
                      initial_stream_window_size: 16777216
                      initial_connection_window_size: 33554432
                      max_outbound_frames: 10000
                      max_outbound_control_frames: 1000
                      max_consecutive_inbound_frames_with_empty_payload: 1
                      max_inbound_priority_frames_per_stream: 100
                      max_inbound_window_update_frames_per_data_frame_sent: 10
                    route_config:
                      name: kserve_v2_route
                      virtual_hosts:
                        - name: triton_vhost
                          domains: ["*"]
                          routes:
                            - match:
                                prefix: "/inference.GRPCInferenceService/"
                              route:
                                cluster: triton_upstream_cluster
                                timeout: 30s
                    http_filters:
                      - name: envoy.filters.http.buffer
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.buffer.v3.Buffer
                          max_request_bytes: 16777216
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
        - name: triton_upstream_cluster
          connect_timeout: 2s
          type: STATIC
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: triton_upstream_cluster
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 10.32.0.100
                          port_value: 9001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-baseline-deployment
  labels:
    app.kubernetes.io/name: envoy-baseline
    app.kubernetes.io/part-of: custos
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: envoy-baseline
  template:
    metadata:
      labels:
        app.kubernetes.io/name: envoy-baseline
        app.kubernetes.io/part-of: custos
    spec:
      nodeName: worker-1
      hostAliases:
        - ip: "10.10.10.12"
          hostnames:
            - "triton-inference-svc"
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: envoy
          image: docker.io/library/python:3.11-slim
          imagePullPolicy: Never
          command:
            - "/opt/host-lib/ld-linux-x86-64.so.2"
            - "--library-path"
            - "/opt/host-lib"
            - "/opt/custos-bin/envoy"
          args:
            - "-c"
            - "/etc/envoy/envoy.yaml"
            - "--base-id"
            - "2"
          ports:
            - name: grpc-baseline
              containerPort: 8002
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "512Mi"
          volumeMounts:
            - name: envoy-config-vol
              mountPath: /etc/envoy
              readOnly: true
            - name: custos-bin
              mountPath: /opt/custos-bin
              readOnly: true
            - name: host-lib
              mountPath: /opt/host-lib
              readOnly: true
      volumes:
        - name: envoy-config-vol
          configMap:
            name: custos-envoy-baseline-config
        - name: custos-bin
          hostPath:
            path: /home/user/custos-bin
            type: Directory
        - name: host-lib
          hostPath:
            path: /lib/x86_64-linux-gnu
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-baseline-svc
  labels:
    app.kubernetes.io/name: envoy-baseline
    app.kubernetes.io/part-of: custos
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: envoy-baseline
  ports:
    - name: grpc-kserve-v2-baseline
      port: 8002
      targetPort: 8002
      nodePort: 30802
      protocol: TCP
