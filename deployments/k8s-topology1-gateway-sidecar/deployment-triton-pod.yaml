apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton-inference-deployment
  labels:
    app.kubernetes.io/name: triton-inference
    app.kubernetes.io/part-of: custos
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: triton-inference
  template:
    metadata:
      labels:
        app.kubernetes.io/name: triton-inference
        app.kubernetes.io/part-of: custos
    spec:
      nodeName: worker-1
      containers:
        - name: triton
          image: docker.io/library/python:3.11-slim
          imagePullPolicy: Never
          command:
            - "/opt/host-lib/ld-linux-x86-64.so.2"
            - "--library-path"
            - "/opt/host-lib"
            - "/opt/custos-bin/tritonserver"
          args:
            - "--model-repository=/models"
            - "--grpc-port=9001"
            - "--http-port=8000"
            - "--metrics-port=8002"
          ports:
            - name: grpc-kserve
              containerPort: 9001
              protocol: TCP
          resources:
            requests:
              cpu: "1000m"
              memory: "512Mi"
            limits:
              cpu: "4000m"
              memory: "4Gi"
          volumeMounts:
            - name: model-repo
              mountPath: /models
              readOnly: true
            - name: custos-bin
              mountPath: /opt/custos-bin
              readOnly: true
            - name: host-lib
              mountPath: /opt/host-lib
              readOnly: true
      volumes:
        - name: model-repo
          emptyDir: {}
        - name: custos-bin
          hostPath:
            path: /home/user/custos-bin
            type: Directory
        - name: host-lib
          hostPath:
            path: /lib/x86_64-linux-gnu
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: triton-inference-svc
  labels:
    app.kubernetes.io/name: triton-inference
    app.kubernetes.io/part-of: custos
spec:
  type: NodePort
  clusterIP: 10.32.0.100
  selector:
    app.kubernetes.io/name: triton-inference
  ports:
    - name: grpc-kserve
      port: 9001
      targetPort: 9001
      nodePort: 30901
      protocol: TCP
    - name: grpc-control-8001
      port: 8001
      targetPort: 9001
      nodePort: 30801
      protocol: TCP
