apiVersion: apps/v1
kind: Deployment
metadata:
  name: custos-gateway-deployment
  labels:
    app.kubernetes.io/name: custos-gateway
    app.kubernetes.io/part-of: custos
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: custos-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: custos-gateway
        app.kubernetes.io/part-of: custos
    spec:
      nodeName: worker-1
      hostAliases:
        - ip: "10.10.10.12"
          hostnames:
            - "triton-inference-svc"
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Kubernetes Native Sidecar (restartPolicy: Always) guarantees the UDS socket
        # is bound before the main Envoy Proxy container starts.
        - name: custos-proc
          image: docker.io/library/python:3.11-slim
          imagePullPolicy: Never
          restartPolicy: Always
          command:
            - "/opt/host-lib/ld-linux-x86-64.so.2"
            - "--library-path"
            - "/opt/host-lib"
            - "/opt/custos-bin/custos-proc"
          args:
            - "--socket-path=/var/run/custos/ext_proc.sock"
            - "--max-nesting-depth=16"
            - "--max-tensor-elements=16777216"
            - "--max-tags-scanned=1024"
            - "--enforce-payload-parity=true"
            - "--max-message-size-mb=32"
            - "--log-format=json"
            - "--log-level=info"
            - "--log-admitted=false"
            - "--stats-interval-secs=60"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            exec:
              command: ["test", "-S", "/var/run/custos/ext_proc.sock"]
            initialDelaySeconds: 1
            periodSeconds: 1
            failureThreshold: 10
          resources:
            requests:
              cpu: "250m"
              memory: "64Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          volumeMounts:
            - name: custos-uds-vol
              mountPath: /var/run/custos
            - name: custos-bin
              mountPath: /opt/custos-bin
              readOnly: true
            - name: host-lib
              mountPath: /opt/host-lib
              readOnly: true
      containers:
        - name: envoy
          image: docker.io/library/python:3.11-slim
          imagePullPolicy: Never
          command:
            - "/opt/host-lib/ld-linux-x86-64.so.2"
            - "--library-path"
            - "/opt/host-lib"
            - "/opt/custos-bin/envoy"
          args:
            - "-c"
            - "/etc/envoy/envoy.yaml"
            - "--component-log-level"
            - "ext_proc:warn"
            - "--base-id"
            - "1"
          ports:
            - name: grpc-ingress
              containerPort: 8001
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "512Mi"
          volumeMounts:
            - name: custos-uds-vol
              mountPath: /var/run/custos
            - name: envoy-config-vol
              mountPath: /etc/envoy
              readOnly: true
            - name: custos-bin
              mountPath: /opt/custos-bin
              readOnly: true
            - name: host-lib
              mountPath: /opt/host-lib
              readOnly: true
      volumes:
        - name: custos-uds-vol
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: envoy-config-vol
          configMap:
            name: custos-envoy-config
        - name: custos-bin
          hostPath:
            path: /home/user/custos-bin
            type: Directory
        - name: host-lib
          hostPath:
            path: /lib/x86_64-linux-gnu
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: custos-gateway-svc
  labels:
    app.kubernetes.io/name: custos-gateway
    app.kubernetes.io/part-of: custos
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: custos-gateway
  ports:
    - name: grpc-kserve-v2
      port: 8001
      targetPort: 8001
      nodePort: 30811
      protocol: TCP
    - name: grpc-eval-prod
      port: 8003
      targetPort: 8001
      nodePort: 30803
      protocol: TCP
