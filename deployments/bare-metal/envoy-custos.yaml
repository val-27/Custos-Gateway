# Topology C (Custos Protected): Envoy Proxy with fail-closed Custos ext_proc over UDS.
# Buffers KServe v2 gRPC request bodies (up to 16 MiB), validates via /var/run/custos/ext_proc.sock,
# and forwards clean payloads to Triton on 127.0.0.1:9001.
admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901

static_resources:
  listeners:
    - name: kserve_v2_grpc_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8001
      per_connection_buffer_limit_bytes: 16777216 # 16 MiB
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_kserve_v2_custos
                codec_type: AUTO
                http2_protocol_options:
                  max_concurrent_streams: 1024
                  initial_stream_window_size: 16777216
                  initial_connection_window_size: 33554432
                route_config:
                  name: kserve_v2_route
                  virtual_hosts:
                    - name: triton_vhost
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/inference.GRPCInferenceService/"
                          route:
                            cluster: triton_upstream_cluster
                            timeout: 30s
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc:
                          cluster_name: custos_uds_cluster
                        timeout: 0.25s
                      failure_mode_allow: false
                      message_timeout: 0.25s
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SKIP
                        request_body_mode: BUFFERED
                        response_body_mode: NONE
                        request_trailer_mode: SKIP
                        response_trailer_mode: SKIP
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: custos_uds_cluster
      connect_timeout: 0.25s
      type: STATIC
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options:
              max_concurrent_streams: 1024
      load_assignment:
        cluster_name: custos_uds_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    pipe:
                      path: /var/run/custos/ext_proc.sock
                      mode: 432 # 0660 octal

    - name: triton_upstream_cluster
      connect_timeout: 2s
      type: STATIC
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: triton_upstream_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 9001
