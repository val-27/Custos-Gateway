[package]
name = "custos-proc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Unprivileged Envoy ext_proc gRPC Unix Domain Socket admission daemon for KServe v2 inference"

[[bin]]
name = "custos-proc"
path = "src/main.rs"

[[bin]]
name = "tritonserver"
path = "src/triton_sim.rs"

[dependencies]
bytes = "1.10"
http = "1.3"
http-body = "1.0"
custos-core = { path = "../custos-core" }
clap = { version = "4.5", features = ["derive", "env"] }
envoy-types = "0.7"
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "fs", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["transport"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
hyper-util = { version = "0.1", features = ["tokio"] }
tempfile = "3.19"
