apiVersion: apps/v1
kind: Deployment
metadata:
  name: custos-gateway-deployment
  labels:
    app.kubernetes.io/name: custos-gateway
    app.kubernetes.io/part-of: custos
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: custos-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: custos-gateway
        app.kubernetes.io/part-of: custos
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Kubernetes Native Sidecar (restartPolicy: Always) guarantees the UDS socket
        # is bound before the main Envoy Proxy container starts.
        - name: custos-proc
          image: custos-proc:latest
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          args:
            - "--socket-path=/var/run/custos/ext_proc.sock"
            - "--max-nesting-depth=16"
            - "--max-tensor-elements=16777216"
            - "--max-message-size-mb=32"
            - "--log-format=json"
            - "--log-level=info"
            - "--log-admitted=true"
            - "--stats-interval-secs=60"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            exec:
              command: ["test", "-S", "/var/run/custos/ext_proc.sock"]
            initialDelaySeconds: 1
            periodSeconds: 1
            failureThreshold: 10
          resources:
            requests:
              cpu: "250m"
              memory: "64Mi"
            limits:
              cpu: "1000m"
              memory: "128Mi"
          volumeMounts:
            - name: custos-uds-vol
              mountPath: /var/run/custos
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.31-latest
          args:
            - "-c"
            - "/etc/envoy/envoy.yaml"
            - "--ComponentLogLevel"
            - "ext_proc:info"
          ports:
            - name: grpc-ingress
              containerPort: 8001
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "512Mi"
          volumeMounts:
            - name: custos-uds-vol
              mountPath: /var/run/custos
            - name: envoy-config-vol
              mountPath: /etc/envoy
              readOnly: true
      volumes:
        - name: custos-uds-vol
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: envoy-config-vol
          configMap:
            name: custos-envoy-config
---
apiVersion: v1
kind: Service
metadata:
  name: custos-gateway-svc
  labels:
    app.kubernetes.io/name: custos-gateway
    app.kubernetes.io/part-of: custos
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: custos-gateway
  ports:
    - name: grpc-kserve-v2
      port: 8001
      targetPort: 8001
      protocol: TCP
